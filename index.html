<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="수도전" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>WOS 수도전 타이밍 계산기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>⚔ WOS 수도전 타이밍 계산기</h1>
      <div class="utc-clock" id="utcClock">00:00:00</div>
      <div class="utc-label">현재 UTC 시간</div>
    </header>

    <nav class="tabs" aria-label="계산기 탭">
      <button class="tab active" data-tab="rallies" type="button">집결장</button>
      <button class="tab" data-tab="defenders" type="button">집결원 (방어)</button>
      <button class="tab" data-tab="switching" type="button">스위칭</button>
    </nav>

    <main>
      <section class="section active" id="ralliesSection">
        <div class="card">
          <div class="card-head">
            <div class="card-title">상대 집결장 설정</div>
            <button class="small-btn" id="addRallyBtn" type="button">+ 집결장 추가</button>
          </div>
          <div class="hint">남은 집결시간은 0430처럼 입력해도 04:30으로 정리됩니다. 입력 후 적용을 누르면 카운트다운이 시작됩니다.</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>이름</th>
                  <th>남은 집결</th>
                  <th>상대 행군(초)</th>
                  <th>상대 도착까지</th>
                  <th>복사</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rallyBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="section" id="defendersSection">
        <div class="card">
          <div class="card-head">
            <div>
              <div class="card-title">수비원 일괄 입력</div>
              <div class="hint">닉네임 행군초 집결장번호 형식으로 붙여넣기</div>
            </div>
            <div class="actions">
              <button class="small-btn" id="bulkPasteBtn" type="button">일괄 입력</button>
              <button class="copy-btn" id="copyBtn" type="button">📋 전체 복사</button>
            </div>
          </div>
          <div class="bulk-tools">
            <label>
              <span>선택 행군(초)</span>
              <input id="bulkMarch" type="number" min="0" placeholder="35" />
            </label>
            <label>
              <span>선택 집결장</span>
              <select id="bulkRally"></select>
            </label>
            <button class="primary-btn" id="applySelectedBtn" type="button">선택 적용</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">집결원 출발 시간</div>
            <button class="small-btn" id="addDefenderBtn" type="button">+ 유저 추가</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><input id="selectAll" type="checkbox" aria-label="전체 선택" /></th>
                  <th>#</th>
                  <th>닉네임</th>
                  <th>행군(초)</th>
                  <th>집결장</th>
                  <th>출발 시간</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="defenderBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="section" id="switchingSection">
        <div class="card">
          <div class="card-title">스위칭</div>
          <div class="switch-grid" id="switchingCopyGrid"></div>
        </div>
        <div class="card">
          <div class="card-title">빠른 관리</div>
          <button class="danger-btn" id="resetBtn" type="button">전체 초기화</button>
        </div>
      </section>
    </main>

    <dialog id="bulkDialog" class="bulk-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>일괄 입력</h2>
          <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
        </div>
        <textarea id="bulkText" spellcheck="false" placeholder="Debbie 42 3&#10;Momo,35,1&#10;Sara	50	5"></textarea>
        <div class="dialog-actions">
          <button class="small-btn" value="cancel" type="submit">취소</button>
          <button class="primary-btn" id="importBulkBtn" value="default" type="button">추가</button>
        </div>
      </form>
    </dialog>

    <footer>🐾 Made by 데비 🐾</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
