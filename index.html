<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OIL WOS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="header-band" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">WOS Rally Board</p>
        <h1 id="page-title">OIL_WOS 집결 현황</h1>
        <p class="lede">열린 집결을 시간순으로 불러와 확인합니다.</p>
      </div>
      <div class="status-panel" aria-live="polite">
        <span class="status-dot" data-status-dot></span>
        <span data-load-status>집결 데이터를 불러오는 중</span>
      </div>
    </section>

    <section class="rally-tools" aria-label="집결 필터">
      <button class="filter-button is-active" type="button" data-filter="active">진행중</button>
      <button class="filter-button" type="button" data-filter="all">전체</button>
      <button class="refresh-button" type="button" data-refresh>새로고침</button>
    </section>

    <section class="rally-board" aria-labelledby="rally-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Live</p>
          <h2 id="rally-heading">집결 목록</h2>
        </div>
        <p class="last-updated" data-last-updated>업데이트 대기중</p>
      </div>

      <div class="empty-state" data-empty-state hidden>
        <strong>열린 집결이 없습니다.</strong>
        <span>새 집결이 등록되면 이곳에 자동으로 표시됩니다.</span>
      </div>

      <div class="rally-list" data-rally-list></div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
