<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOS 수비 주유 계산기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>WOS 수비 주유 계산기</h1>
        <div class="clock">
          <strong id="utcClock">00:00:00</strong>
          <span>현재 UTC 시간</span>
        </div>
      </header>

      <section class="panel rally-panel" aria-labelledby="rallyTitle">
        <div class="panel-head">
          <div>
            <h2 id="rallyTitle">집결장</h2>
            <p>남은 집결시간과 상대 행군시간을 입력하면 도착 기준이 계산됩니다.</p>
          </div>
          <button class="ghost-button" id="addRallyBtn" type="button">+ 집결장</button>
        </div>
        <div class="table-wrap compact-table">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>이름</th>
                <th>남은 집결</th>
                <th>상대 행군(초)</th>
                <th>도착까지</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rallyBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel controls-panel" aria-labelledby="quickTitle">
        <div class="panel-head">
          <div>
            <h2 id="quickTitle">빠른 입력</h2>
            <p>예: Debbie 42 3 또는 Debbie,42,3</p>
          </div>
          <div class="button-row">
            <button class="ghost-button" id="bulkPasteBtn" type="button">일괄 입력</button>
            <button class="ghost-button" id="copyBtn" type="button">전체 복사</button>
            <button class="danger-button" id="resetBtn" type="button">초기화</button>
          </div>
        </div>
        <div class="bulk-tools">
          <label>
            <span>선택 행군(초)</span>
            <input id="bulkMarch" type="number" min="0" placeholder="예: 35" />
          </label>
          <label>
            <span>선택 집결장</span>
            <select id="bulkRally"></select>
          </label>
          <button class="primary-button" id="applySelectedBtn" type="button">선택 적용</button>
        </div>
      </section>

      <section class="panel defender-panel" aria-labelledby="defenderTitle">
        <div class="panel-head">
          <div>
            <h2 id="defenderTitle">수비원</h2>
            <p>출발까지 남은 시간이 분:초로 표시됩니다.</p>
          </div>
          <button class="ghost-button" id="addDefenderBtn" type="button">+ 수비원</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input id="selectAll" type="checkbox" aria-label="전체 선택" /></th>
                <th>#</th>
                <th>닉네임</th>
                <th>행군(초)</th>
                <th>집결장</th>
                <th>출발까지</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="defenderBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="bulkDialog" class="bulk-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>일괄 입력</h2>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <textarea id="bulkText" spellcheck="false" placeholder="Debbie 42 3&#10;Momo,35,1&#10;Sara	50	5"></textarea>
        <div class="dialog-actions">
          <button class="ghost-button" value="cancel" type="submit">취소</button>
          <button class="primary-button" id="importBulkBtn" value="default" type="button">추가</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
